# Mirrors the in-game Notices (docs/NOTICES.md) into the Discord channel #in-game-notices.
# Needs the repository secret DISCORD_NOTICES_WEBHOOK (the channel's webhook URL).
name: Discord notices
on:
  push:
    branches: [main]
    paths: [docs/NOTICES.md, tools/discord/sync-notices.js]
  workflow_dispatch:
concurrency: discord-notices
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Runs are queued (concurrency), so each one starts from the newest main: it then sees the message ids the
      # previous run saved and never posts a notice twice.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync notices
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_NOTICES_WEBHOOK }}
        run: node tools/discord/sync-notices.js
      - name: Save message ids
        if: always()
        run: |
          [ -f docs/notices/discord-state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/notices/discord-state.json
          git diff --cached --quiet || git commit -m "Discord notices: message ids [skip ci]"
          git pull --rebase -q && git push -q
